[workspace]

[package]
name = "amaru-mobile"
version = "0.1.0"
description = "Amaru Bluetooth mobile dashboard"
authors = ["PRAGMA"]
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "amaru_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", default-features = false , features = [] }
tauri-plugin-blec = { path = "../vendor/tauri-plugin-blec" }
